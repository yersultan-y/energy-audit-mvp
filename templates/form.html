<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Energy Bill Analyzer</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-lg shadow-xl p-8 w-full max-w-md">
        <h1 class="text-3xl font-bold text-gray-800 mb-2">Energy Audit</h1>
        <p class="text-gray-600 mb-6">Instant cost analysis & savings recommendations</p>

        <form id="analyzeForm" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700">Your Name</label>
                <input type="text" name="name" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500" placeholder="Aibek Ibraev">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Email</label>
                <input type="email" name="email" required class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500" placeholder="you@company.kz">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Building Size (sqm)</label>
                <input type="number" name="building_size" required step="1" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500" placeholder="2500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Monthly Cost (₸)</label>
                <input type="number" name="monthly_cost" required step="0.01" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500" placeholder="250000">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700">Monthly Usage (kWh)</label>
                <input type="number" name="monthly_kwh" required step="1" class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500" placeholder="15000">
            </div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 rounded-lg transition">Get Analysis</button>
        </form>

        <div id="result" class="mt-6 hidden p-4 bg-green-50 border border-green-200 rounded-lg">
            <p id="resultText" class="text-green-800 font-medium"></p>
        </div>
        <div id="error" class="mt-6 hidden p-4 bg-red-50 border border-red-200 rounded-lg">
            <p id="errorText" class="text-red-800 font-medium"></p>
        </div>
    </div>

    <script>
        document.getElementById('analyzeForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const data = Object.fromEntries(new FormData(e.target));
            try {
                const response = await fetch('/api/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await response.json();
                if (result.success) {
                    document.getElementById('resultText').textContent = result.message;
                    document.getElementById('result').classList.remove('hidden');
                    document.getElementById('error').classList.add('hidden');
                    e.target.reset();
                } else {
                    document.getElementById('errorText').textContent = result.error;
                    document.getElementById('error').classList.remove('hidden');
                    document.getElementById('result').classList.add('hidden');
                }
            } catch (err) {
                document.getElementById('errorText').textContent = 'Error: ' + err.message;
                document.getElementById('error').classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
